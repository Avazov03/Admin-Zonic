# Zon Admin — Nginx example
# usage: server_name va root ni o'zgartiring

server {
    listen 80;
    server_name admin.example.com;

    root /var/www/zon-admin;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # no cache for config (API URL o'zgarsa darhol yangilansin)
    location = /admin/js/app-config.js {
        add_header Cache-Control "no-store";
    }

    # optional: reverse proxy API same-origin (CORS kerak bo'lmasa)
    # location /api/ {
    #     proxy_pass http://18.197.174.196:5065/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header Authorization $http_authorization;
    # }
}
