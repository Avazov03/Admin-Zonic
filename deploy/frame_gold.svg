<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldOuter" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="22%" stop-color="#F5C542"/>
      <stop offset="48%" stop-color="#D4A017"/>
      <stop offset="72%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="472" y1="40" x2="40" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#FFF8E1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#D4A017" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8B6914" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- soft backdrop -->
  <rect width="512" height="512" rx="96" fill="#1A1206"/>
  <circle cx="256" cy="240" r="210" fill="url(#glow)"/>

  <!-- outer ornate frame -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="none" stroke="url(#goldOuter)" stroke-width="28" filter="url(#softShadow)"/>
  <rect x="72" y="72" width="368" height="368" rx="72" fill="none" stroke="url(#goldInner)" stroke-width="8" opacity="0.95"/>
  <rect x="88" y="88" width="336" height="336" rx="64" fill="none" stroke="#FFF6D0" stroke-width="2" opacity="0.55"/>

  <!-- corner ornaments -->
  <g stroke="url(#goldOuter)" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M110 150 V118 H142"/>
    <path d="M402 150 V118 H370"/>
    <path d="M110 362 V394 H142"/>
    <path d="M402 362 V394 H370"/>
  </g>
  <g fill="url(#goldOuter)">
    <circle cx="118" cy="126" r="7"/>
    <circle cx="394" cy="126" r="7"/>
    <circle cx="118" cy="386" r="7"/>
    <circle cx="394" cy="386" r="7"/>
  </g>

  <!-- top crest -->
  <path d="M256 78 C272 78 286 92 286 108 C286 124 272 136 256 148 C240 136 226 124 226 108 C226 92 240 78 256 78 Z"
        fill="url(#goldOuter)" stroke="#FFF6D0" stroke-width="2"/>
  <circle cx="256" cy="108" r="10" fill="#FFF8E1" opacity="0.9"/>

  <!-- center preview window (avatar hole) -->
  <rect x="128" y="128" width="256" height="256" rx="52" fill="#0E0A04" stroke="#5C4A1E" stroke-width="3"/>
  <rect x="140" y="140" width="232" height="232" rx="46" fill="none" stroke="#F5C542" stroke-width="1.5" opacity="0.35"/>

  <!-- subtle sparkles -->
  <g fill="#FFF8E1" opacity="0.85">
    <circle cx="168" cy="168" r="2.5"/>
    <circle cx="344" cy="176" r="2"/>
    <circle cx="180" cy="340" r="2"/>
    <circle cx="336" cy="332" r="2.5"/>
  </g>
</svg>
